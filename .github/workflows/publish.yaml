name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      registry:
        description: 'bazel central registry target'
        required: false
        default: 'fweikert/bazel-central-registry'
        type: string
      registry_fork:
        description: ''
        required: true
        default: publish-to-bcr-dev/bazel-central-registry
        type: string
    secrets:
      publish_token:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'tag_name'
        required: true
        type: string
      registry:
        description: 'bazel central registry target'
        required: false
        default: 'fweikert/bazel-central-registry'
        type: string
      registry_fork:
        description: ''
        required: true
        default: publish-to-bcr-dev/bazel-central-registry
        type: string

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@c6213378a1d6351a92b3219d1becd65cbdda8240
    with:
      tag_name: ${{ inputs.tag_name }}
      registry: ${{ inputs.registry }}
      registry_fork: ${{ inputs.registry_fork }}
      open_pull_request: false
      module_roots: |
        .
        sub/module
      attest: true
    secrets:
      publish_token: ${{ secrets.PUBLISH_TOKEN }}
